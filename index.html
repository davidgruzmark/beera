<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity - Modern Jira-Like Project & Task Management</title>
    
    <!-- Design system icons -->
    <link rel="icon" type="image/svg+xml" href="/src/typescript.svg" />
    
    <!-- Primary styles -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="top-bar-logo-area">
        <span class="top-bar-icon" id="top-bar-logo-mount"></span>
        <span class="top-bar-title">Beera</span>
      </div>
      <div class="top-bar-meta-area">
        <button class="btn btn-primary" id="btn-global-create-task" style="padding: 8px 14px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 8px;">
          <span id="global-create-task-icon" style="display: flex;"></span>
          <span id="lbl-global-create-task">Create Task</span>
        </button>
        <span class="top-bar-project-indicator" id="top-bar-project-name"></span>
        <div class="top-bar-avatar">D</div>
      </div>
    </header>

    <!-- Main Glassmorphic Grid Layout Container -->
    <div class="app-container" id="app-root">
      
      <!-- Sidebar Mount Point -->
      <aside id="sidebar-mount" style="position: relative;"></aside>
      
      <!-- Main Content viewport (Kanban Board / Dashboard Analytics) -->
      <main id="content-mount" style="flex: 1; height: 100%; display: flex; flex-direction: column; overflow: hidden;"></main>
      
    </div>

    <!-- Task Details backdrop-blurred slideover/modal -->
    <div class="modal-backdrop" id="task-modal-backdrop"></div>

    <!-- Project Creation Modal -->
    <div class="modal-backdrop" id="project-modal-backdrop">
      <div class="modal-card modal-card-small">
        <div class="modal-header">
          <h3 id="lbl-create-project-title">Create New Project</h3>
          <button class="modal-close-btn" id="btn-close-project-modal">✕</button>
        </div>
        <div class="modal-body">
          <form id="form-create-project" style="display: flex; flex-direction: column; gap: 16px;">
            
            <div class="form-group">
              <label class="form-label" id="lbl-proj-name" for="project-name-input">Project Name</label>
              <input 
                type="text" 
                class="form-input" 
                id="project-name-input" 
                placeholder="e.g. Apollo Space Mission" 
                required 
              />
            </div>

            <div class="form-row" style="display: flex; gap: 16px;">
              <div class="form-group" style="flex: 2;">
                <label class="form-label" id="lbl-proj-key" for="project-key-input">Project Key</label>
                <input 
                  type="text" 
                  class="form-input" 
                  id="project-key-input" 
                  placeholder="e.g. APO" 
                  maxlength="6"
                  required 
                />
              </div>
              
              <div class="form-group" style="flex: 1; position: relative;">
                <label class="form-label" id="lbl-proj-icon" for="project-icon-input">Icon</label>
                <button type="button" class="btn btn-secondary" id="btn-emoji-picker-trigger" style="width: 100%; font-size: 1.2rem; padding: 10px; display: flex; align-items: center; justify-content: center; min-height: 46px;">
                  🚀
                </button>
                <input 
                  type="hidden" 
                  id="project-icon-input" 
                  value="🚀"
                />
                <!-- Glassmorphic Emoji Picker Popup -->
                <div class="emoji-picker-popup" id="emoji-picker-popup"></div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" id="lbl-proj-desc" for="project-desc-input">Description</label>
              <textarea 
                class="form-textarea" 
                id="project-desc-input" 
                placeholder="Brief project details..." 
                style="min-height: 80px;"
              ></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
              <button type="button" class="btn btn-secondary" id="btn-cancel-project-modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="btn-submit-project">Create Project</button>
            </div>
            
          </form>
        </div>
      </div>
    </div>

    <!-- Script Entrypoint -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
